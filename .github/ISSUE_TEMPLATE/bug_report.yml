name: Bug report
description: Report a reproducible GrimeQuest software problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve GrimeQuest.

        **Privacy:** do not upload household photos, product-label photos, addresses, access codes, provider/API keys, or other private data. Describe the issue with synthetic/redacted information.
        **Security vulnerabilities:** do not file them as public bug reports; follow SECURITY.md.
  - type: dropdown
    id: mode
    attributes:
      label: Area
      options:
        - Real photo cleaning quest
        - Illustrated demo (no XP)
        - Monster collection / My wins
        - Camera / photo picker / HEIC
        - Install / offline / PWA update
        - Accessibility
        - Build / tests / deployment
        - Historical API / developer tools
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: App version or short Git commit if known. The app may be installed and cached; note Safari tab vs Home Screen.
      placeholder: v0.1.0 / abc12345
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted examples only.
      placeholder: |
        1. Open …
        2. Tap …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device/browser family
      options:
        - iPhone / Safari
        - Android / Chrome
        - Desktop / Chrome or Chromium
        - Desktop / Safari
        - Desktop / Firefox
        - Other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include private photos, labels, credentials, addresses, or other sensitive data.
          required: true
