# GitHub's optional automatically generated release-note categories.
# Publishing a release remains a deliberate maintainer action.
# This file does NOT trigger GitHub Actions or create a release.
changelog:
  exclude:
    labels:
      - "skip-changelog"
  categories:
    - title: "Security and privacy"
      labels:
        - "security"
        - "privacy"
    - title: "Game and experience"
      labels:
        - "gameplay"
        - "enhancement"
        - "accessibility"
    - title: "Fixes"
      labels:
        - "bug"
    - title: "Documentation and tooling"
      labels:
        - "documentation"
        - "dependencies"
    - title: "Other changes"
      labels:
        - "*"
