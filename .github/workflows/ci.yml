name: GrimeQuest local-contract qualification
# Manual only: do not trigger external CI spending merely by publishing this source.
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: grimequest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build.py
      - run: npm run typecheck && npm test
      - run: python -m pytest --cov=server --cov-fail-under=90
      - run: python scripts/verify_build.py
      - run: git diff --exit-code -- client/catalog.ts web preview.html
