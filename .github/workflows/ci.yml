name: GrimeQuest local-contract qualification
# Standard hosted runners are free for public repositories. Private copies
# remain manual-only; this qualification never calls a paid model provider.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: grimequest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: npm ci --ignore-scripts
      - run: python -m playwright install --with-deps chromium
      - name: Prepare pinned ZXing browser assets
        run: |
          zxing_tmp="$(mktemp -d)"
          trap 'rm -rf "$zxing_tmp"' EXIT
          npm pack @zxing/library@0.21.3 --ignore-scripts --registry=https://registry.npmjs.org --pack-destination "$zxing_tmp" --silent
          mkdir -p web/vendor
          tar -xzf "$zxing_tmp/zxing-library-0.21.3.tgz" -C "$zxing_tmp" package/umd/index.min.js package/LICENSE
          cp "$zxing_tmp/package/umd/index.min.js" web/vendor/zxing-0.21.3.min.js
          cp "$zxing_tmp/package/LICENSE" web/vendor/zxing.LICENSE.txt
          test -s web/vendor/zxing-0.21.3.min.js
          test -s web/vendor/zxing.LICENSE.txt
          node --check web/vendor/zxing-0.21.3.min.js
      - run: python scripts/build.py
      - run: npm run typecheck && npm test
      - run: python -m pytest --cov=server --cov-fail-under=90
      - run: python scripts/verify_build.py
      - run: git diff --exit-code -- client/catalog.ts web preview.html
      - name: Verify safe source release archive and checksum
        run: |
          python scripts/package_release.py
          cd ..
          sha256sum --check GrimeQuest-v*.sha256
